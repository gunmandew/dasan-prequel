<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사라진 90분 — 기록 조회</title>
<meta name="description" content="2026 심야 독서캠프 홍보용 미스터리 시연">
<style>
@font-face{font-family:DosStory;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-2@1.0/DOSIyagiMedium.woff2') format('woff2');font-display:swap}
@font-face{font-family:BookkMyungjo;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkMyungjo-Lt.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:BookkMyungjo;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/BookkMyungjo-Bd.woff2') format('woff2');font-weight:700;font-display:swap}
:root{color-scheme:dark;--green:#98e6a4;--dim:#83a78a;--line:#365740;--red:#ef9e9e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#080c09;color:var(--green);font-family:DosStory,'Malgun Gothic',Consolas,monospace;display:grid;place-items:center;padding:25px 16px;line-height:1.65}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 18%,#1c3021 0%,#060a07 70%);pointer-events:none}
.terminal{position:relative;width:min(900px,100%);min-height:635px;border:1px solid #43634b;border-radius:12px;background:linear-gradient(135deg,#0d170f,#080d09 80%);box-shadow:0 0 0 6px #111b13,0 25px 80px #000b,inset 0 0 65px #000b;overflow:hidden}
.terminal:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,#0002 4px 5px);pointer-events:none;opacity:.6;z-index:9}
.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 27px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim);letter-spacing:.04em}
.live{display:inline-flex;align-items:center;gap:7px}.live:before{content:"";width:6px;height:6px;border-radius:50%;background:#9bff9f;box-shadow:0 0 7px #9bff9f}
.content{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:clamp(25px,5vw,57px)}
.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--dim);margin-bottom:10px}
h1{font-size:clamp(27px,4vw,43px);letter-spacing:.03em;font-weight:normal;line-height:1.22;margin:0 0 23px;text-shadow:0 0 18px #56b86955}
h2{font-size:23px;font-weight:normal;margin:0 0 14px}p{margin:0 0 12px;color:#bedbc3}.muted{font-size:14px;color:var(--dim)}
.rule{border:0;border-top:1px solid var(--line);margin:22px 0 27px}.step{display:flex;gap:7px;margin:0 0 28px}
.step span{width:30px;height:3px;background:#2b4031;border-radius:5px}.step span.on{background:var(--green);box-shadow:0 0 8px #8ee49c55}
.prompt{color:#ccecd1;font-size:18px;margin:24px 0 12px}
form{margin-top:16px}.field{display:block;margin-bottom:13px}.field label{display:block;margin-bottom:6px;font-size:14px;color:var(--dim)}
input{font-family:inherit;font-size:20px;color:#c8f8d0;outline:0;background:#0b170e;border:1px solid #406c4a;border-radius:4px;padding:13px 14px;width:100%;letter-spacing:.08em}
input:focus{border-color:#a2efaf;box-shadow:0 0 0 2px #a2efaf22}input::placeholder{color:#53745b;letter-spacing:0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:23px;align-items:center}
button{font:inherit;font-size:15px;cursor:pointer;border-radius:4px;padding:12px 18px;transition:background .15s ease,border-color .15s ease}
.primary{background:#91dba0;color:#0a180e;border:1px solid #91dba0;font-weight:bold}
.primary:hover,.primary:focus-visible{background:#c6f1cb;border-color:#c6f1cb}
.secondary{background:transparent;color:#a9d6b2;border:1px solid #44634c}.secondary:hover,.secondary:focus-visible{background:#1b3221}
button:disabled{cursor:wait;opacity:.65}.error{color:#e8a2a2;font-size:14px;min-height:25px;margin:9px 0 0}
.info{border:1px solid #35543e;background:#111d14;padding:17px 20px;border-radius:4px;margin:20px 0}
.info b{color:#ceeeda;font-weight:normal}.info strong{color:#f1aeae;font-weight:normal}
.logline{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dotted #2e4a36;padding:10px 0;font-size:16px}
.logline:last-child{border-bottom:0}.logline span:last-child{color:#b6d4ba}.logline.broken{color:#f0a0a0;background:#361c1b;animation:flicker .2s 4}
.logline.broken span:last-child{color:#f0a0a0}.loader{width:100%;height:4px;background:#1c3021;margin:23px 0;overflow:hidden}.loader i{display:block;height:100%;background:#93dfa1;width:0;animation:load 1.6s forwards}
@keyframes load{to{width:100%}}@keyframes flicker{25%{opacity:.2}50%{opacity:1}75%{opacity:.3}}
.glitch{animation:flicker .16s 7}.alert{border:1px solid #844949;background:#291516;padding:18px 20px;color:#edb5b5;border-radius:4px}
.alert p{color:#edb5b5}.overlay{position:fixed;inset:0;background:#010401d9;z-index:20;display:grid;place-items:center;padding:20px;overflow:auto}
.paper{position:relative;background:#e4dfd0;color:#303b31;width:min(650px,100%);padding:clamp(25px,5vw,46px);box-shadow:0 18px 60px #000;transform:rotate(-.35deg);border:1px solid #b8b19e;background-image:repeating-linear-gradient(0deg,#00000009 0 1px,transparent 1px 28px);font-family:BookkMyungjo,'Batang',serif}
.paper:before{content:"보존 사본";position:absolute;right:25px;top:18px;border:2px solid #9e5e5b;color:#9e5e5b;padding:2px 9px;font-size:12px;transform:rotate(11deg)}
.paper small{color:#606b5f}.paper h2{text-align:center;color:#202f24;margin:26px 0 23px}.paper table{width:100%;border-collapse:collapse;margin:20px 0;font-size:15px}
.paper td{border:1px solid #8b9587;padding:12px 10px}.paper td:first-child{width:38%;background:#c8cabe80}.paper .memo{border-top:1px solid #9ca699;padding-top:13px;font-size:14px;color:#47594a}
.paper button{background:#263c2c;color:#eff6eb;border:0;font-family:inherit}
.stamp{color:#9e5e5b;text-align:right;font-size:14px;margin-top:19px}
.footer{position:relative;z-index:1;color:#668771;font-size:11px;text-align:center;padding:0 20px 23px}
[hidden]{display:none!important}
@media(max-width:600px){body{padding:6px;place-items:stretch}.terminal{min-height:calc(100vh - 12px)}.bar{padding:12px 15px}.content{padding:29px 20px}.fields{grid-template-columns:1fr}.logline{font-size:14px}.paper td{padding:8px 6px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="terminal">
 <header class="bar"><span>다산정보관 / 출입기록 조회 단말기</span><span class="live">시스템 연결됨</span></header>
 <div class="content">
  <div class="eyebrow">2026 · 야간 보관 자료</div>
  <h1 id="title">출입기록 조회</h1>
  <div class="step" aria-label="진행 단계"><span id="progress0" class="on"></span><span id="progress1"></span><span id="progress2"></span><span id="progress3"></span></div>
  <section id="scene" aria-live="polite"></section>
 </div>
 <footer class="footer">DS-1386 / 심야 독서캠프 · 체험형 가상 미스터리 · 시연 버전</footer>
</main>
<div class="overlay" id="document" hidden role="dialog" aria-modal="true" aria-label="시설점검표">
 <article class="paper">
  <small>다산정보관 시설 관리 자료 · 보존 문서</small>
  <h2>시설 정기점검표</h2>
  <table>
   <tbody>
    <tr><td>점검 시설</td><td><b>다산정보관</b></td></tr>
    <tr><td>시설관리 연락처</td><td>041-560-1386</td></tr>
    <tr><td>점검일자</td><td>2026. 11. <span id="paper-day">23.</span></td></tr>
    <tr><td>출입 장치 점검시각</td><td>18:00</td></tr>
    <tr><td>대상 구역</td><td>3층 일반자료실</td></tr>
    <tr><td>점검 결과</td><td>시설 이상 없음</td></tr>
   </tbody>
  </table>
  <div class="memo">특이사항: 야간 출입기록과 현장 점검기록 간 대조 필요. 전산 기록 원본은 별도 보관.</div>
  <div class="stamp">기록 담당자 확인</div>
  <div class="actions"><button id="close-document" type="button">기록 닫기 ×</button></div>
 </article>
</div>
<script>
(() => {
  'use strict';
  // 행사일 확정 후 이 한 곳만 수정: 1123 또는 1130
  const EVENT_DATE = '1123';
  const EVENT_DATE_OPTIONS = ['1123', '1130']; // 시연 중에는 두 후보 날짜 허용
  const START_TIME = '1800';
  const CASE_ID = 'DS-1386';
  const state = {page:0,place:'',date:'',time:'',revealed:false};
  const scene=document.getElementById('scene');
  const title=document.getElementById('title');
  const dialog=document.getElementById('document');
  const paperDay=document.getElementById('paper-day');
  paperDay.textContent=EVENT_DATE.slice(-2)+'.';
  const html=(s)=>{scene.innerHTML=s;};
  function btn(id,fn){document.getElementById(id)?.addEventListener('click',fn);}
  function showDocument(){dialog.hidden=false;document.getElementById('close-document').focus();}
  function closeDocument(){dialog.hidden=true;document.getElementById('show-document')?.focus();}
  btn('close-document',closeDocument);
  dialog.addEventListener('click',e=>{if(e.target===dialog)closeDocument();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!dialog.hidden)closeDocument();});
  function setPage(n){state.page=n;title.textContent=['출입기록 조회','조회 일시 확인','출입기록 검색 결과','미확인 기록'][n];for(let i=0;i<4;i++)document.getElementById('progress'+i).classList.toggle('on',i<=n);render();}
  function fail(message){const el=document.getElementById('message');if(el){el.textContent=message;el.setAttribute('role','alert');}}
  function render(){
    if(state.page===0){
      html('<p>조회할 시설의 명칭을 입력하십시오.</p><p class="muted">시설명을 모를 경우 보존된 시설기록을 확인할 수 있습니다.</p><form id="place-form"><div class="field"><label for="place">시설명</label><input id="place" autocomplete="off" placeholder="시설명 입력" required></div><div class="error" id="message"></div><div class="actions"><button class="primary" type="submit">다음 기록 조회 →</button><button class="secondary" id="show-document" type="button">▤ 시설기록 확인</button></div></form>');
      document.getElementById('place').value=state.place;
      btn('show-document',showDocument);
      document.getElementById('place-form').addEventListener('submit',e=>{e.preventDefault();const v=document.getElementById('place').value.trim().replace(/\s/g,'');if(v==='다산정보관'){state.place=v;setPage(1);}else fail('조회할 시설이 일치하지 않습니다. 시설기록을 다시 확인하십시오.');});
    }else if(state.page===1){
      html('<p>시설이 확인되었습니다.</p><div class="info"><b>조회 위치: 다산정보관</b><br><span class="muted">기록 조회를 위해 점검일자와 점검시각을 입력하십시오.</span></div><form id="datetime-form"><div class="fields"><div class="field"><label for="date">날짜</label><input id="date" type="text" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="4자리 숫자" required autocomplete="off"></div><div class="field"><label for="time">시간</label><input id="time" type="text" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="4자리 숫자" required autocomplete="off"></div></div><div class="error" id="message"></div><div class="actions"><button class="primary" type="submit">출입기록 검색 →</button><button class="secondary" id="show-document" type="button">▤ 시설기록 확인</button><button class="secondary" id="go-back" type="button">← 이전</button></div></form>');
      document.getElementById('date').value=state.date;document.getElementById('time').value=state.time;
      btn('show-document',showDocument);btn('go-back',()=>setPage(0));
      document.getElementById('datetime-form').addEventListener('submit',e=>{e.preventDefault();const d=document.getElementById('date').value,t=document.getElementById('time').value;state.date=d;state.time=t;if(!/^\d{4}$/.test(d)||!/^\d{4}$/.test(t)){fail('날짜와 시간을 숫자 네 자리로 입력하십시오.');return;}if(!EVENT_DATE_OPTIONS.includes(d)){fail('해당 날짜의 시설점검 기록이 없습니다.');return;}if(t!==START_TIME){fail('해당 시각의 점검 기록이 없습니다.');return;}setPage(2);});
    }else if(state.page===2){
      html('<p>일치하는 출입기록을 찾았습니다.</p><div class="info"><b>다산정보관 · 3층 일반자료실</b><br><span class="muted">조회일자: 2026. '+state.date.slice(0,2)+'. '+state.date.slice(2,4)+'. / 조회 기준시각: '+state.time.slice(0,2)+':'+state.time.slice(2,4)+'</span></div><div id="logs"><div class="logline"><span>18:00</span><span>시설점검 완료</span></div><div class="logline"><span>18:55</span><span>출입 확인</span></div><div class="logline"><span>19:00</span><span>마지막 열람 기록</span></div><div class="logline" id="missing"><span>20:30</span><span>출입 확인</span></div></div><div id="scan-box"><div class="loader"><i></i></div><p class="muted">원본 자료와 출입기록을 대조하는 중...</p></div><div id="anomaly" hidden><div class="alert"><b>비정상적인 출입기록이 감지되었습니다.</b><p>19:00~20:30 구간의 기록을 확인할 수 없습니다.</p><p>기록번호: '+CASE_ID+'</p></div><div class="actions"><button class="primary" id="inspect" type="button">이 기록을 확인해 볼래? →</button></div></div>');
      window.setTimeout(()=>{if(state.page!==2)return;const row=document.getElementById('missing');if(row){row.classList.add('broken');row.innerHTML='<span>19:00~20:30</span><span>▒▒ 기록 확인 불가 ▒▒</span>';}document.getElementById('scan-box').hidden=true;document.getElementById('anomaly').hidden=false;document.getElementById('logs').classList.add('glitch');btn('inspect',()=>setPage(3));},1750);
    }else{
      html('<div class="eyebrow">접근 권한 확인</div><div class="alert"><b>원본 기록을 열 수 없습니다.</b><p>기록번호: '+CASE_ID+'</p><p>열람 시각: 19:00~20:30</p><p>원본 보관 위치: 다산정보관 내부</p></div><hr class="rule"><h2>사라진 90분의 진실을<br>확인하시겠습니까?</h2><p>삭제된 것으로 보이는 기록의 원본은 도서관 내부에서만 확인할 수 있습니다.</p><div class="info"><b>2026 심야 독서캠프</b><br><span class="muted">행사 날짜: 미확정 (11월 23일 또는 30일 예정)</span><br><span class="muted">장소: 다산정보관</span><br><span class="muted">사건번호: '+CASE_ID+'</span></div><p class="muted">※ 이 페이지는 체험형 미스터리 시연이며 실제 출입기록이 아닙니다.</p><div class="actions"><button class="primary" id="restart" type="button">처음부터 다시 조사하기 ↻</button></div>');
      btn('restart',()=>{state.place='';state.date='';state.time='';setPage(0);});
    }
  }
  setPage(0);
})();
</script>
</body>
</html>
